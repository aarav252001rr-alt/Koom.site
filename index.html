<script>
const all=s=>[...document.querySelectorAll(s)];
const J={get(k,d){try{const v=JSON.parse(LS.get(k));return v??d}catch(e){return d}},set(k,v){LS.set(k,JSON.stringify(v))}};
let FAV=J.get('ml.fav',[]),HIST=J.get('ml.hist',[]),PLAYS=J.get('ml.plays',{}),UPL=J.get('ml.pl',[]),DM=J.get('ml.dlm',{});
const S={quality:'lossless',dlq:'lossless',speed:1,autoplay:1,lyAnim:1,lyBlur:1,lys:'m',...J.get('ml.set',{})};
const saveS=()=>J.set('ml.set',S);
const A=new Audio();A.preload='metadata';A.volume=.8;
let P=[],U=[],Q=[],qi=-1,curPl=null,view='home',shuffle=0,rep=0,drag=0,L=[],ai=-1,enrichedAll=0,sqv='',raf=0,tok=0,pend=0,cs={off:false,high:false};
let OFF=new Set(),DLP={},OBJ={},sleep={t:null,end:0,eot:false},lastAnchor=null;
const TM=new Map(),QP={id:'~quick',name:'Quick Play',tracks:[]};
const V=$('#view'),sz=e=>+e.dataset.s||24,NPopen=()=>$('#np').classList.contains('open');
const fmtMB=b=>b>1073741824?(b/1073741824).toFixed(2)+' GB':(b/1048576).toFixed(1)+' MB';
function applySet(){document.body.classList.toggle('nblur',!S.lyBlur);document.body.dataset.lys=S.lys;A.defaultPlaybackRate=S.speed;A.playbackRate=S.speed}

/* ---------- IndexedDB (offline downloads) ---------- */
const DB=new Promise((res,rej)=>{try{const r=indexedDB.open('ml',1);r.onupgradeneeded=()=>r.result.createObjectStore('dl');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});DB.catch(()=>{});
const idb=(mode,fn)=>DB.then(db=>new Promise((res,rej)=>{const tx=db.transaction('dl',mode),rq=fn(tx.objectStore('dl'));tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error)}));

/* ---------- static icons ---------- */
all('[data-ic]').forEach(e=>e.innerHTML=ic(e.dataset.ic,+e.dataset.s||22));
all('.shf').forEach(e=>e.innerHTML=ic('shuf',sz(e)));all('.pv').forEach(e=>e.innerHTML=ic('prev',sz(e)));
all('.nx').forEach(e=>e.innerHTML=ic('next',sz(e)));all('.rpt').forEach(e=>e.innerHTML=ic('rep',sz(e)));
all('.vi').forEach(e=>e.innerHTML=ic('vol',20));
$('#bl').innerHTML=ic('quote',20);$('#bqu').innerHTML=ic('list',20);$('#npx').innerHTML=ic('down',22);
$('#nm').innerHTML=ic('more',22);$('#lyx').innerHTML=ic('expand',20);$('#lyc').innerHTML=ic('x',20);
const setPP=()=>{all('.pp').forEach(e=>{e.innerHTML=ic(A.paused?'play':'pause',sz(e));e.setAttribute('aria-label',_(A.paused?'play':'pause'))});document.body.classList.toggle('paused',A.paused)};setPP();
function syncHearts(){all('.hb').forEach(b=>{const on=FAV.includes(b.dataset.u);b.classList.toggle('on',on);b.innerHTML=ic(on?'heartf':'heart',sz(b)||18)})}
function syncDl(){
  const t=Q[qi],b=$('#ndl');
  if(t){const u=t.url,p=DLP[u],on=OFF.has(u);b.innerHTML=p!=null?`<span style="font-size:.7rem;font-weight:700">${Math.round(p*100)}%</span>`:ic(on?'dldone':'dl',22);b.classList.toggle('on',on);b.setAttribute('aria-label',_(on?'rmDl':'dlOffline'))}
  all('[data-pg]').forEach(e=>{const p=DLP[e.dataset.pg];e.style.width=(p==null?0:p*100)+'%'});
}

/* ---------- menus ---------- */
let cmItems=[];
function openMenu(items,anchor,head){
  cmItems=items;if(anchor)lastAnchor=anchor;const a=anchor||lastAnchor,m=$('#cm');
  m.innerHTML=(head?`<div class="cmt">${esc(head)}</div>`:'')+items.map((x,k)=>x.sep?'<hr>':`<button data-k="${k}" class="${x.on?'on':''}">${x.i?ic(x.i,18):''}<span>${esc(x.l)}</span>${x.r?`<em>${esc(x.r)}</em>`:''}</button>`).join('');
  m.hidden=false;$('#scrim').hidden=false;
  if(innerWidth>860){
    if(a&&a.isConnected){const r=a.getBoundingClientRect();let top=r.bottom+6;if(top+m.offsetHeight>innerHeight-10)top=Math.max(10,r.top-m.offsetHeight-6);m.style.top=top+'px';m.style.left=Math.max(10,Math.min(r.left,innerWidth-m.offsetWidth-10))+'px'}
    else{m.style.top=Math.max(10,(innerHeight-m.offsetHeight)/3)+'px';m.style.left=(innerWidth-m.offsetWidth)/2+'px'}
  }
}
function closeMenu(){$('#cm').hidden=true;$('#scrim').hidden=true}
$('#scrim').onclick=closeMenu;
$('#cm').onclick=e=>{const b=e.target.closest('button[data-k]');if(!b)return;const x=cmItems[+b.dataset.k];closeMenu();x&&x.fn&&x.fn()};

/* ---------- favourites / history / playlists ---------- */
function toggleFav(t){if(!t)return;const i=FAV.indexOf(t.url);if(i>=0){FAV.splice(i,1);toast(_('favOff'))}else{FAV.unshift(t.url);toast(_('favOn'))}J.set('ml.fav',FAV);syncHearts();if(view==='fav')route(1)}
function logPlay(t){HIST=HIST.filter(h=>h.u!==t.url);HIST.unshift({u:t.url,t:Date.now()});HIST=HIST.slice(0,50);PLAYS[t.url]=(PLAYS[t.url]||0)+1;J.set('ml.hist',HIST);J.set('ml.plays',PLAYS)}
function buildU(){U=UPL.map(x=>({id:x.id,name:x.name,custom:1,description:'',tracks:x.urls.map(u=>TM.get(u)?.t).filter(Boolean)}))}
function newPl(){const n=prompt(_('plName'));if(!n||!n.trim())return null;const id='u'+Date.now().toString(36);UPL.push({id,name:n.trim(),urls:[]});J.set('ml.pl',UPL);buildU();drawSide();return U.find(x=>x.id===id)}
function addToPl(id,t){const x=UPL.find(u=>u.id===id);if(!x)return;if(x.urls.includes(t.url))return toast(_('plHas'));x.urls.push(t.url);J.set('ml.pl',UPL);buildU();toast(_('plAdded',{n:x.name}))}
function pickPl(t){
  const items=U.map(p=>({l:p.name,i:'list',fn:()=>addToPl(p.id,t)}));
  items.push({sep:1},{l:_('plNew'),i:'plus',fn:()=>{const p=newPl();if(p)addToPl(p.id,t)}});
  openMenu(items,null,_('plAddTo'));
}
function rmFromPl(p,t){const x=UPL.find(u=>u.id===p.id);if(!x)return;x.urls=x.urls.filter(u=>u!==t.url);J.set('ml.pl',UPL);buildU();route(1)}
function byId(id){
  if(id==='~fav')return{id,name:'Favourites',tracks:FAV.map(u=>TM.get(u)?.t).filter(Boolean)};
  if(id==='~hist')return{id,name:'Recently Played',tracks:HIST.filter(h=>TM.has(h.u)).map(h=>TM.get(h.u).t)};
  if(id==='~dl')return{id,name:'Downloads',tracks:[...OFF].filter(u=>TM.has(u)).sort((a,b)=>(DM[b]?.date||0)-(DM[a]?.date||0)).map(u=>TM.get(u).t)};
  if(id==='~quick')return QP;
  return P.find(p=>p.id===id)||U.find(p=>p.id===id);
}
function qpick(){
  const sh=a=>a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  const fav=sh(FAV.map(u=>TM.get(u)?.t).filter(Boolean)).slice(0,5);
  const top=Object.entries(PLAYS).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([u])=>TM.get(u)?.t).filter(Boolean);
  const set=new Set([...fav,...top]);sh([...TM.values()].map(x=>x.t)).forEach(t=>{if(set.size<12)set.add(t)});
  QP.tracks=sh([...set]).slice(0,12);
}

/* ---------- offline downloads ---------- */
async function addDl(t){
  if(OFF.has(t.url)||DLP[t.url]!=null)return;DLP[t.url]=0;syncDl();toast(_('dlStart',{n:title(t)}));
  try{
    const high=S.dlq==='high'&&t.alt,src=high?t.alt:t.url,r=await fetch(src);if(!r.ok)throw 0;
    const len=+r.headers.get('Content-Length')||(high?0:t.size)||0,rd=r.body.getReader(),ch=[];let n=0;
    for(;;){const{done,value}=await rd.read();if(done)break;ch.push(value);n+=value.length;DLP[t.url]=len?Math.min(n/len,.99):.5;syncDl()}
    const blob=new Blob(ch,{type:r.headers.get('Content-Type')||'audio/flac'});
    await idb('readwrite',s=>s.put({blob},t.url));
    OFF.add(t.url);DM[t.url]={size:blob.size,date:Date.now(),q:high?'high':'lossless'};J.set('ml.dlm',DM);toast(_('dlDone',{n:title(t)}));
  }catch(e){toast(_('dlFail',{n:title(t)}))}
  delete DLP[t.url];syncDl();if(view==='downloads')route(1);
}
async function rmDl(t){
  try{await idb('readwrite',s=>s.delete(t.url))}catch(e){}
  OFF.delete(t.url);delete DM[t.url];J.set('ml.dlm',DM);
  if(OBJ[t.url]&&Q[qi]!==t){URL.revokeObjectURL(OBJ[t.url]);delete OBJ[t.url]}
  syncDl();if(view==='downloads')route(1);toast(_('dlRemoved'));
}
async function dlAll(p){
  if(!p||!p.tracks.length)return;const todo=p.tracks.filter(t=>!OFF.has(t.url));
  if(!todo.length)return toast(_('dlAllDone'));toast(_('dlMany',{n:todo.length}));
  for(const t of todo)await addDl(t);
}
async function resolveSrc(t){
  if(OFF.has(t.url)){try{if(!OBJ[t.url]){const r=await idb('readonly',s=>s.get(t.url));if(r)OBJ[t.url]=URL.createObjectURL(r.blob)}}catch(e){}if(OBJ[t.url])return OBJ[t.url]}
  return S.quality==='high'&&t.alt?t.alt:t.url;
}

/* ---------- lyrics ---------- */
function lrc(s){
  const o=[];
  for(const l of s.split(/\r?\n/)){
    const st=[...l.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];if(!st.length)continue;
    const raw=l.replace(/\[\d+:\d+(?:\.\d+)?\]/g,'').trim();
    const w=[...raw.matchAll(/<(\d+):(\d+(?:\.\d+)?)>([^<]*)/g)].map(m=>[+m[1]*60+ +m[2],m[3]]);
    const tx=raw.replace(/<[^>]*>/g,'').trim();
    st.forEach(x=>o.push({t:+x[1]*60+ +x[2],tx,w}));
  }
  return o.sort((a,b)=>a.t-b.t);
}
async function getLy(t){
  if(t.lyr!==undefined)return;
  let s=t.c.lyrics;if(Array.isArray(s))s=s.join('\n');
  s=s||t.tags.SYNCEDLYRICS||t.tags.LYRICS||t.tags.UNSYNCEDLYRICS||'';
  if(!s&&t.c.lyricsUrl){try{s=await (await fetch(t.c.lyricsUrl)).text()}catch(e){}}
  if(!s&&!t.c.lyricsUrl){try{const r=await fetch(t.url.replace(/\.flac$/i,'.lrc'));if(r.ok){const x=await r.text();if(!/^\s*<(!doctype|html)/i.test(x))s=x}}catch(e){}}
  t.lyr=s;
}
function drawLy(){
  const t=Q[qi];if(!t)return;const s=t.lyr||'',b=$('#ly');L=lrc(s);ai=-2;
  if(!s){b.innerHTML='<div class="msg">Lyrics aren\'t available for this song.</div>';return}
  if(L.length>1){
    if(L[0].t>6)L.unshift({t:0,tx:'',w:[]});
    b.innerHTML=L.map((l,i)=>`<p id="l${i}" data-t="${l.t}" class="${!l.tx?'gap':(l.w.length||!S.lyAnim?'':'k')}">${!l.tx?'<i></i><i></i><i></i>':(l.w.length?l.w.map(w=>`<span class="wd" data-t="${w[0]}">${esc(w[1])}</span>`).join(''):esc(l.tx))}</p>`).join('');
  }else{L=[];b.innerHTML=`<p class="plain">${esc(s)}</p>`}
  lyStart();
}
function lyStart(){cancelAnimationFrame(raf);raf=requestAnimationFrame(lyFrame)}
function lyActive(sc){
  const ps=all('#ly p');ps.forEach((p,k)=>{p.classList.toggle('on',k===ai);p.style.setProperty('--d',ai<0?0:Math.min(Math.abs(k-ai),5))});
  const e=ps[ai];if(e&&sc){const b=$('#ly');b.scrollTo({top:e.offsetTop-b.clientHeight*.35,behavior:'smooth'})}
}
function lyFrame(){
  raf=0;if(!L.length||!NPopen()||$('#ly').hidden)return;
  const ct=A.currentTime+.12;let i=ai;
  if(i<0||(L[i]&&L[i].t>ct))i=-1;
  while(i+1<L.length&&L[i+1].t<=ct)i++;
  if(i!==ai){ai=i;lyActive(true)}
  if(i>=0&&S.lyAnim){
    const l=L[i],el=$('#l'+i);
    if(el&&l.tx){
      if(l.w.length)el.querySelectorAll('.wd').forEach(s=>s.classList.toggle('w',+s.dataset.t<=A.currentTime));
      else{const nx=L[i+1]?L[i+1].t:l.t+4;el.style.setProperty('--f',Math.max(0,Math.min(1,(A.currentTime-l.t)/Math.max(.4,(nx-l.t)*.92)))*100+'%')}
    }
  }
  raf=requestAnimationFrame(lyFrame);
}
function drawQ(){
  if(!Q.length){$('#qq').innerHTML='<div class="msg">'+_('queueEmpty')+'</div>';return}
  $('#qq').innerHTML=`<div class="qh">${_('upNext')} · ${_('songs',{n:Q.length})}</div>`+Q.map((t,i)=>`<div class="qr ${i===qi?'cur':''}" data-i="${i}" tabindex="0" role="button"><img src="${cover(t)}" alt=""><div><b>${esc(title(t))}</b><small>${esc(artist(t))}</small></div><span>${dur(t)?mm(dur(t)):''}</span>${i===qi?'<i></i>':`<button class="ib sm" data-x aria-label="${_('remove')}">${ic('x',16)}</button>`}</div>`).join('');
}
function qAdd(t,next){if(!Q.length){Q=[t];play(0);return}Q.splice(next?qi+1:Q.length,0,t);drawQ();toast(_(next?'qNext':'qAdded'))}
function qRm(i){if(i===qi)return;Q.splice(i,1);if(i<qi)qi--;drawQ()}

/* ---------- now playing UI ---------- */
const qLabel=t=>cs.high?'High Efficiency':(qual(t).hi?'Hi-Res Lossless':'Lossless');
function ui(full=true){
  const t=Q[qi];if(!t)return;const Y=qual(t),d=dur(t)||A.duration,c=cover(t),yr=F(t,'year','DATE').slice(0,4);
  const fmt=cs.high&&t.alt?(t.alt.split('?')[0].split('.').pop().toUpperCase()):'FLAC';
  $('#bc').src=$('#nc').src=$('#lyi').src=c;$('#npbg').style.backgroundImage=`url("${c}")`;
  $('#bt').textContent=$('#nt').textContent=$('#lyt').textContent=title(t);
  $('#ba').textContent=$('#lya').textContent=artist(t);$('#na').textContent=artist(t)+(F(t,'album')?' — '+F(t,'album'):'');
  $('#bq').textContent=qLabel(t);
  $('#nbd').innerHTML=`<span class="chip ${!cs.high&&Y.hi?'hi':''}">${qLabel(t)}</span><span class="chip">${fmt}${!cs.high&&Y.spec?' · '+Y.spec:''}</span>`+(cs.off?'<span class="chip">'+_('downloaded')+'</span>':'')+(!cs.high&&t.size&&d?`<span class="chip">~${Math.round(t.size*8/d/1000)} kbps</span>`:'')+(F(t,'genre')?`<span class="chip">${esc(F(t,'genre'))}</span>`:'')+(yr?`<span class="chip">${esc(yr)}</span>`:'');
  all('.dur').forEach(e=>e.textContent=mm(d));document.title=title(t)+' — '+artist(t);
  all('#bh,#nh').forEach(b=>b.dataset.u=t.url);syncHearts();syncDl();

   ${sr(_('stLang'),_('stLangD'),`<select class="sel" data-ss="lang" aria-label="${_('stLang')}">${Object.entries(LANGS).map(([c,n])=>`<option value="${c}" ${c===LANG?'selected':''}>${n}</option>`).join('')}</select>`)}
  </div></div>
  <div class="sg"><h2>${_('stAudio')}</h2><div class="sc">
   ${sr(_('stSpeed'),'',`<select class="sel" data-ss="speed" aria-label="${_('stSpeed')}">${[0.5,0.75,1,1.25,1.5,2].map(v=>`<option value="${v}" ${S.speed===v?'selected':''}>${v===1?_('normal'):v+'×'}</option>`).join('')}</select>`)}
   ${sr(_('stAuto'),_('stAutoD'),sw('autoplay'))}
   ${sr(_('sleepT'),sl,`<select class="sel" data-ss="sleep" aria-label="${_('sleepT')}"><option value="0">${_('off')}</option><option value="15">${_('m15')}</option><option value="30">${_('m30')}</option><option value="45">${_('m45')}</option><option value="60">${_('h1')}</option><option value="eot">${_('eos')}</option></select>`)}
  </div></div>
  <div class="sg"><h2>${_('stLyrics')}</h2><div class="sc">
   ${sr(_('stSing'),_('stSingD'),sw('lyAnim'))}
   ${sr(_('stBlur'),_('stBlurD'),sw('lyBlur'))}
   ${sr(_('stSize'),'',seg2('lys',[['s','S'],['m','M'],['l','L']],S.lys))}
  </div></div>
  <div class="sg"><h2>${_('stStorage')}</h2><div class="sc">
   ${sr(_('stHist'),_('songs',{n:HIST.length}),`<button class="btn2" data-act="clearhist">${_('clear')}</button>`)}
   ${sr(_('stFavs'),_('songs',{n:FAV.length}),`<button class="btn2" data-act="clrfav">${_('clear')}</button>`)}
   ${sr(_('stReset'),_('stResetD'),`<button class="btn2 red" data-act="resetset">${_('reset')}</button>`)}
  </div></div>
  <div class="sg"><h2>${_('stKeys')}</h2><div class="sc"><div class="kb"><kbd>Space / K</kbd><span>${_('ksPlay')}</span><kbd>J / L</kbd><span>${_('ksSeek10')}</span><kbd>← →</kbd><span>${_('ksSeek5')}</span><kbd>↑ ↓</kbd><span>${_('ksVol')}</span><kbd>M</kbd><span>${_('ksMute')}</span><kbd>0–9</kbd><span>${_('ksJump')}</span><kbd>Shift+N / P</kbd><span>${_('ksNP')}</span><kbd>F</kbd><span>${_('ksFav')}</span><kbd>Shift+L</kbd><span>${_('ksLy')}</span><kbd>${_('ksTap')}</kbd><span>${_('ksTapD')}</span></div></div></div>
  ${kAbout()}`;
}
function act(a,c){
  const pid=c.dataset.pid,p=pid?byId(pid):null,setShuf=()=>{shuffle=1;all('.shf').forEach(e=>e.classList.add('on'))};
  switch(a){
    case 'shufall':{const T=[...TM.values()].map(x=>x.t);if(!T.length)return;Q=T;setShuf();play(Math.floor(Math.random()*T.length));break}
    case 'qrefresh':qpick();route(1);break;
    case 'pplay':if(p&&p.tracks.length)playFrom(p,0);break;
    case 'pshuf':if(p&&p.tracks.length){setShuf();playFrom(p,Math.floor(Math.random()*p.tracks.length))}break;
    case 'dlall':dlAll(p);break;
    case 'newpl':{const n=newPl();if(n)location.hash='#/p/'+encodeURIComponent(n.id);break}
    case 'renpl':{const x=UPL.find(u=>u.id===pid),n=x&&prompt(_('newName'),x.name);if(n&&n.trim()){x.name=n.trim();J.set('ml.pl',UPL);buildU();route(1)}break}
    case 'delpl':if(confirm(_('cfPl'))){UPL=UPL.filter(u=>u.id!==pid);J.set('ml.pl',UPL);buildU();location.hash='#/'}break;
    case 'clearhist':if(confirm(_('cfHist'))){HIST=[];PLAYS={};J.set('ml.hist',HIST);J.set('ml.plays',PLAYS);route(1)}break;
    case 'clrfav':if(confirm(_('cfFav'))){FAV=[];J.set('ml.fav',FAV);syncHearts();route(1)}break;
    case 'rmalldl':if(confirm(_('cfDl'))){idb('readwrite',s=>s.clear()).catch(()=>{});Object.values(OBJ).forEach(u=>URL.revokeObjectURL(u));OBJ={};OFF=new Set();DM={};J.set('ml.dlm',DM);syncDl();route(1);toast(_('allDlRm'))}break;
    case 'resetset':Object.assign(S,{quality:'lossless',dlq:'lossless',speed:1,autoplay:1,lyAnim:1,lyBlur:1,lys:'m'});saveS();applySet();route(1);toast(_('setReset'));break;
  }
}
document.addEventListener('click',e=>{const c=e.target.closest('[data-act]');if(c){e.preventDefault();act(c.dataset.act,c)}});
V.onclick=e=>{
  const r=e.target.closest('.tr');
  if(r){
    const p=byId(r.dataset.p),i=+r.dataset.i,t=p&&p.tracks[i];if(!t)return;
    if(e.target.closest('.hb')){toggleFav(t);return}
    const mb=e.target.closest('.mb');if(mb){trackMenu(t,p,mb);return}
    playFrom(p,i);return;
  }
  const q=e.target.closest('.qk[data-i]');if(q){playFrom(QP,+q.dataset.i);return}
  const rc=e.target.closest('.rc');if(rc){playFrom(byId('~hist'),+rc.dataset.i);return}
  const sk=e.target.closest('[data-sk]');
  if(sk){const k=sk.dataset.sk,v=sk.dataset.sv;if(k==='quality'){setQuality(v);return}S[k]=v;saveS();applySet();route(1);if(k==='lys'&&Q[qi])drawLy();return}
  const st=e.target.closest('[data-st]');if(st){S[st.dataset.st]=S[st.dataset.st]?0:1;saveS();applySet();route(1);if(Q[qi])drawLy();return}
  const th=e.target.closest('[data-th]');if(th){setTheme(th.dataset.th);route(1)}
};
V.onkeydown=e=>{
  if(e.key!=='Enter')return;const r=e.target.closest('.tr');
  if(r){const p=byId(r.dataset.p);if(p)playFrom(p,+r.dataset.i);return}
  if(e.target.classList.contains('qk')&&e.target.dataset.i)playFrom(QP,+e.target.dataset.i);
  else if(e.target.classList.contains('rc'))playFrom(byId('~hist'),+e.target.dataset.i);
};
V.onchange=e=>{
  const s=e.target.closest('select[data-ss]');if(!s)return;
  if(s.dataset.ss==='speed'){S.speed=+s.value;saveS();applySet()}else if(s.dataset.ss==='sleep'){setSleep(s.value);route(1)}else if(s.dataset.ss==='lang'){setLang(s.value);refreshLang()}
};
function route(keep){
  const m=(location.hash.slice(1)||'/').split('/'),k=m[1];
  if(k==='p')showPl(decodeURIComponent(m[2]||''));else if(k==='search')showSearch();else if(k==='fav')showFav();else if(k==='history')showHist();else if(k==='downloads')showDl();else if(k==='settings')showSet();else showHome();
  all('[data-k]').forEach(a=>a.classList.toggle('act',a.dataset.k===view));drawSide();fin();if(!keep)scrollTo(0,0);
}
window.onhashchange=()=>route();

/* ---------- language ---------- */
function applyI18n(){
  all('[data-i18n]').forEach(e=>e.textContent=_(e.dataset.i18n));
  [['Aria','aria-label'],['Title','title'],['Alt','alt'],['Ph','placeholder']].forEach(([k,a])=>all(`[data-i18n-${k.toLowerCase()}]`).forEach(e=>e.setAttribute(a,_(e.dataset['i18n'+k]))));
}
function initLang(){applyI18n();buildHdr();setPP();if(!Q[qi])$('#bt').textContent=_('notPlaying')}
function refreshLang(){initLang();if(Q[qi]){ui();drawQ();drawLy()}route(1)}
initLang();

</script>
<script src="koom.js"></script>
